{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>Reset password</h1>
    <p class="muted">Enter your email and we will send you a link to set a new password.</p>
    <form method="post" class="form">
      {% csrf_token %}
      {{ form }}
      <button type="submit" class="button button-primary">Send reset link</button>
    </form>
    <p class="form-links"><a href="{% url 'login' %}">Back to log in</a></p>
  </div>
{% endblock %}
