{# Simple front/back body drawn for LiftLog (no third-party artwork).          #}
{# Shapes with class "m" are muscles; c.<muscle> adds m-primary / m-secondary. #}
{# Each figure is drawn around x=100 (x 46–154) and shifted into place.     #}
<svg class="muscle-map" viewBox="0 0 280 360" role="img" aria-label="Muscle map. {{ description }}">
  <title>{{ description }}</title>

  {# ---------------- FRONT ---------------- #}
  <g transform="translate(-35 0)">
    <text class="map-label" x="100" y="356" text-anchor="middle">Front</text>
    <circle class="b" cx="100" cy="24" r="16"/>
    <rect class="m {{ c.neck }}" x="93" y="40" width="14" height="12" rx="3"/>
    <path class="m {{ c.traps }}" d="M93 49 L76 60 L93 58 Z M107 49 L124 60 L107 58 Z"/>
    <ellipse class="m {{ c.shoulders }}" cx="68" cy="70" rx="12" ry="14"/>
    <ellipse class="m {{ c.shoulders }}" cx="132" cy="70" rx="12" ry="14"/>
    <path class="m {{ c.chest }}" d="M99 60 L80 62 Q72 68 74 86 Q82 98 99 96 Z M101 60 L120 62 Q128 68 126 86 Q118 98 101 96 Z"/>
    <ellipse class="m {{ c.biceps }}" cx="60" cy="104" rx="8" ry="17"/>
    <ellipse class="m {{ c.biceps }}" cx="140" cy="104" rx="8" ry="17"/>
    <ellipse class="m {{ c.forearms }}" cx="55" cy="145" rx="7" ry="20"/>
    <ellipse class="m {{ c.forearms }}" cx="145" cy="145" rx="7" ry="20"/>
    <circle class="b" cx="52" cy="174" r="6"/>
    <circle class="b" cx="148" cy="174" r="6"/>
    <rect class="m {{ c.abdominals }}" x="88" y="100" width="24" height="56" rx="6"/>
    <path class="m {{ c.abdominals }}" d="M80 100 L86 102 L86 154 L81 147 Z M120 100 L114 102 L114 154 L119 147 Z"/>
    <path class="b" d="M82 158 L118 158 L121 178 L79 178 Z"/>
    <ellipse class="m {{ c.abductors }}" cx="74" cy="180" rx="5" ry="11"/>
    <ellipse class="m {{ c.abductors }}" cx="126" cy="180" rx="5" ry="11"/>
    <ellipse class="m {{ c.quadriceps }}" cx="86" cy="220" rx="10" ry="34"/>
    <ellipse class="m {{ c.quadriceps }}" cx="114" cy="220" rx="10" ry="34"/>
    <path class="m {{ c.adductors }}" d="M97 184 L100 184 L100 228 L95 214 Z M103 184 L100 184 L100 228 L105 214 Z"/>
    <circle class="b" cx="86" cy="260" r="6"/>
    <circle class="b" cx="114" cy="260" r="6"/>
    <ellipse class="m {{ c.calves }}" cx="86" cy="296" rx="8" ry="26"/>
    <ellipse class="m {{ c.calves }}" cx="114" cy="296" rx="8" ry="26"/>
    <ellipse class="b" cx="86" cy="330" rx="9" ry="5"/>
    <ellipse class="b" cx="114" cy="330" rx="9" ry="5"/>
  </g>

  {# ---------------- BACK ---------------- #}
  <g transform="translate(105 0)">
    <text class="map-label" x="100" y="356" text-anchor="middle">Back</text>
    <circle class="b" cx="100" cy="24" r="16"/>
    <rect class="m {{ c.neck }}" x="93" y="40" width="14" height="12" rx="3"/>
    <rect class="m {{ c.lower_back }}" x="89" y="122" width="22" height="34" rx="4"/>
    <path class="m {{ c.middle_back }}" d="M100 90 L88 75 L88 112 L100 122 L112 112 L112 75 Z"/>

    <circle class="b" cx="52" cy="174" r="6"/>
    <circle class="b" cx="148" cy="174" r="6"/>
    <ellipse class="m {{ c.abductors }}" cx="75" cy="176" rx="5" ry="11"/>
    <ellipse class="m {{ c.abductors }}" cx="125" cy="176" rx="5" ry="11"/>

    <ellipse class="m {{ c.calves }}" cx="114" cy="294" rx="10" ry="24"/>
    <ellipse class="b" cx="86" cy="330" rx="9" ry="5"/>
    <ellipse class="b" cx="114" cy="330" rx="9" ry="5"/>
  </g>
</svg>
