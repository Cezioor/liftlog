{% extends "base.html" %}

{% block title %}{% if exercise %}Edit exercise{% else %}Add exercise{% endif %}{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>{% if exercise %}Edit {{ exercise.name }}{% else %}Add exercise{% endif %}</h1>
    <form method="post" class="form">
      {% csrf_token %}
      {{ form }}
      <button type="submit" class="button button-primary">Save</button>
    </form>
    <p class="form-links"><a href="{% url 'exercises:exercise_list' %}">Cancel</a></p>
  </div>
{% endblock %}
