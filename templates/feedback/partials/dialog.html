{% load i18n %}{# On every page for logged-in users; opened by the "Zgłoś" link in the top bar. #}
<dialog class="feedback-dialog" id="feedback-dialog" aria-labelledby="feedback-title">
  <div class="feedback-dialog-head">
    <h2 id="feedback-title">{% translate "Report" context "send feedback" %}</h2>
    <button type="button" class="icon-button" data-feedback-close aria-label="{% translate "Close" %}">✕</button>
  </div>
  <div data-feedback-body>
    {% include "feedback/partials/form.html" %}
  </div>
</dialog>
