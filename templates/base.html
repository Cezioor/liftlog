{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}LiftLog{% endblock %} · LiftLog</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}">LiftLog</a>
    {% if user.is_authenticated %}
      <nav class="nav">
        <a href="{% url 'exercises:exercise_list' %}"{% if request.resolver_match.app_name == 'exercises' %} aria-current="page"{% endif %}>Exercises</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="link-button">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main class="container">
    {% if messages %}
      <ul class="messages" role="status">
        {% for message in messages %}
          <li class="message message-{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
