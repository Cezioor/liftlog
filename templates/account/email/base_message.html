<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LiftLog{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:28px 28px 8px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#1f2328;">
              <p style="margin:0 0 4px;font-size:14px;font-weight:bold;color:#1f7a3f;">LiftLog</p>
              <p style="margin:0 0 16px;">Cześć,</p>
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#59636e;">
              <p style="margin:16px 0 0;border-top:1px solid #e3e6ea;padding-top:16px;">
                LiftLog, dziennik treningowy:
                <a href="{{ request.scheme }}://{{ current_site.domain }}/" style="color:#59636e;">{{ current_site.domain }}</a><br>
                Ta wiadomość została wysłana automatycznie w związku z kontem w LiftLog.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
