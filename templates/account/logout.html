{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Log out" %}{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>{% translate "Log out?" %}</h1>
    <form method="post" action="{% url 'account_logout' %}" class="form">
      {% csrf_token %}
      {{ redirect_field }}
      <button type="submit" class="button button-primary">{% translate "Log out" %}</button>
    </form>
  </div>
{% endblock %}
