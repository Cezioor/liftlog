{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>Reset password</h1>
    <p class="muted">Enter your email and we'll send you a link to set a new password.</p>
    <form method="post" action="{% url 'account_reset_password' %}" class="form" data-submit-once novalidate>
      {% csrf_token %}
      {% include "account/snippets/field.html" with field=form.email %}
      <button type="submit" class="button button-primary" data-busy-text="Sending…">Send reset link</button>
    </form>
    <p class="form-links"><a href="{% url 'account_login' %}">Back to log in</a></p>
  </div>
{% endblock %}
