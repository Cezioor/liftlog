{# One form field: label, its errors right above the input, help text below. #}
<div class="field{% if field.errors %} field-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.errors %}
    <ul class="errorlist" id="{{ field.auto_id }}_errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
  {% endif %}
  {{ field }}
  {% if field.help_text and show_help %}<div class="helptext">{{ field.help_text|safe }}</div>{% endif %}
</div>
