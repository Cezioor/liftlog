[project]
name = "liftlog"
version = "0.1.0"
description = "Gym tracker with AI-built training plans"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
filterwarnings = [
    # WhiteNoise warns that collectstatic hasn't been run; tests don't need it.
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = bugbear,
# UP = pyupgrade, DJ = Django-specific checks.
select = ["E", "F", "I", "B", "UP", "DJ"]
