name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Same database engine as production (Neon runs Postgres).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: liftlog
          # Throwaway container that only lives for this job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/liftlog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Generate a throwaway secret key
        # Random per run, so no key is stored in the repository.
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Check production settings
        run: python manage.py check --deploy --fail-level WARNING
        env:
          RENDER_EXTERNAL_HOSTNAME: liftlog.onrender.com

      - name: Check static files build
        run: python manage.py collectstatic --no-input

      - name: Run tests
        run: pytest
