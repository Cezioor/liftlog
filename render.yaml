# Render Blueprint: Render reads this file when you create the service with
# "New > Blueprint". Secrets are NOT stored here: DJANGO_SECRET_KEY is generated
# by Render and DATABASE_URL, BREVO_API_KEY and DEFAULT_FROM_EMAIL are typed into
# the dashboard (sync: false).
services:
  - type: web
    name: liftlog
    runtime: python
    plan: free
    region: frankfurt # same region as the Neon database (AWS eu-central-1)
    branch: main
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Brevo API key (emails: sign-up links, password reset) and the sender, e.g.
      # "LiftLog <you@example.com>"; the address must be a verified sender in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # "mandatory" (default when unset) or "optional": optional lets people in right
      # after sign-up while the confirmation link is still sent.
      - key: ACCOUNT_EMAIL_VERIFICATION
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
